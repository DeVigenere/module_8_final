name: CI Build

on:
  push:
    branches: [ main, debug ]
  pull_request:
    branches: [ main, debug ]

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install system tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl zip unzip tar build-essential ninja-build

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ github.workspace }}/vcpkg_installed
        key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-linux-

    - name: Configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    - name: Verify
      run: |
        ls -la bin/
        test -f bin/receiver
        test -f bin/calculator_sender

  build-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ github.workspace }}/vcpkg_installed
        key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-windows-

    - name: Configure
      run: cmake -B build -S .

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Run tests
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Verify
      run: |
        dir bin\Release\
        if (!(Test-Path bin\Release\receiver.exe)) { exit 1 }
        if (!(Test-Path bin\Release\calculator_sender.exe)) { exit 1 }
      shell: pwsh